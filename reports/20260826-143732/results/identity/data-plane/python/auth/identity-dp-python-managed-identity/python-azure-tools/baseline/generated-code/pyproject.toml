[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-managed-identity-example"
version = "0.1.0"
description = "Examples for authenticating Azure SDK clients with managed identity"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "azure-identity>=1.17.0,<2",
    "azure-keyvault-secrets>=4.8.0,<5",
    "azure-storage-blob>=12.20.0,<13",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9"]

[project.scripts]
managed-identity-demo = "managed_identity_demo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

