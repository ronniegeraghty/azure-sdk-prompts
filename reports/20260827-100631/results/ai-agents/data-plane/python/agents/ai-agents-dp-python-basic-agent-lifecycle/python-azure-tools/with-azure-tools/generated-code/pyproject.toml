[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hyoka-basic-agent"
version = "0.1.0"
description = "A basic synchronous Azure AI Agent console conversation."
requires-python = ">=3.9"
dependencies = [
    "azure-ai-agents==1.1.0",
    "azure-identity==1.25.1",
]

[project.scripts]
hyoka-basic-agent = "main:main"

[tool.setuptools]
py-modules = ["main"]
