<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>hyoka · variation B developed</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="terminal.css" />
  <style>
    body { margin: 0; font-family: "Inter", system-ui, sans-serif; background: #f3f3f2; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="spinner.jsx"></script>
  <script type="text/babel" src="terminal-b-primitives.jsx"></script>
  <script type="text/babel" src="terminal-b-scenes.jsx"></script>

  <script type="text/babel">
    const { DesignCanvas, DCSection, DCArtboard } = window;

    function App() {
      return (
        <DesignCanvas
          title="hyoka · variation B, developed"
          subtitle="full lifecycle as scenes: plan → running (collapsed history + live blocks) → failure detail → final summary"
        >
          <DCSection id="lifecycle" title="B · lifecycle" subtitle="Completed blocks stay fully expanded in scrollback. Collapsed one-liners appear only in the final summary.">
            <DCArtboard id="b1-plan" label="1 · plan &amp; queue" width={900} height={460}>
              <div data-screen-label="B1 plan" className="term-scroll"><TerminalB_Plan /></div>
            </DCArtboard>
            <DCArtboard id="b2-mid" label="2 · mid-flight (3 workers, 3 evals)" width={980} height={720}>
              <div data-screen-label="B2 mid" className="term-scroll"><TerminalB_Mid /></div>
            </DCArtboard>
            <DCArtboard id="b3-queue" label="3 · 2 workers, longer queue remaining" width={1000} height={900}>
              <div data-screen-label="B3 queue" className="term-scroll"><TerminalB_Queue /></div>
            </DCArtboard>
            <DCArtboard id="b4-final" label="4 · final summary (collapsed)" width={900} height={560}>
              <div data-screen-label="B4 final" className="term-scroll"><TerminalB_Final /></div>
            </DCArtboard>
            <DCArtboard id="b5-verbose" label="5 · --verbose mode" width={1000} height={700}>
              <div data-screen-label="B5 verbose" className="term-scroll"><TerminalB_Verbose /></div>
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
