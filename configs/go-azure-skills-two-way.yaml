# Two-arm comparison: baseline and Azure skills plus Azure MCP.
# No Azure SDK for Go plugin is currently available in microsoft/skills.
configs:
  - name: go-azure-skills/baseline
    description: "Go baseline without Azure MCP or skills"
    generator:
      model: "gpt-5.6-sol"
      system_prompt: >
        When the prompt requests code, create a complete runnable project in the
        workspace using file-write tools. Include all required source files and
        dependency or project manifests. Place the primary project and its
        manifest at the workspace root so standard build commands run there.
        Do not provide the implementation only as Markdown code blocks in the
        final response. The final response may summarize the created files and
        include any requested explanation.
    reviewer:
      models:
        - "gpt-5.6-sol"
      tools:
        - name: reviewer-skills
          type: skill
          source: local
          skill_dir: true
          path: "./skills/reviewer"
    limits:
      max_turns: 100

  - name: go-azure-skills/azure-skill-mcp
    description: "Go with Azure MCP and general Azure skills"
    generator:
      model: "gpt-5.6-sol"
      system_prompt: >
        When the prompt requests code, create a complete runnable project in the
        workspace using file-write tools. Include all required source files and
        dependency or project manifests. Place the primary project and its
        manifest at the workspace root so standard build commands run there.
        Do not provide the implementation only as Markdown code blocks in the
        final response. The final response may summarize the created files and
        include any requested explanation.
      tools:
        - name: azure
          type: mcp
          command: npx
          args: ["-y", "@azure/mcp@3.0.0-beta.38", "server", "start"]
          mcp_tools: ["*"]
        - name: azure-skills
          type: plugin
          source: remote
          repo: microsoft/azure-skills
    reviewer:
      models:
        - "gpt-5.6-sol"
      tools:
        - name: reviewer-skills
          type: skill
          source: local
          skill_dir: true
          path: "./skills/reviewer"
    limits:
      max_turns: 100
