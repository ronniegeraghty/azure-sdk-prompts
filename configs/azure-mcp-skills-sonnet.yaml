# Azure MCP with Claude Sonnet 4.5 + remote Azure SDK TypeScript skills
# Skills are fetched from microsoft/skills via git sparse-checkout at eval time.
configs:
  - name: azure-mcp-skills/claude-sonnet-4.5
    description: "Azure MCP + Skills — Claude Sonnet 4.5 with remote Azure SDK skills"
    generator:
      model: "claude-sonnet-4.5"
      tools:
        - name: azure
          type: mcp
          command: npx
          args: ["-y", "@azure/mcp@latest", "server", "start"]
          mcp_tools: ["*"]
        - name: generator-skills
          type: skill
          source: local
          skill_dir: true
          path: "./skills/generator"
        - name: azure-identity-ts
          type: skill
          source: remote
          repo: microsoft/skills/.github/plugins/azure-sdk-typescript/skills
        - name: azure-storage-blob-ts
          type: skill
          source: remote
          repo: microsoft/skills/.github/plugins/azure-sdk-typescript/skills
        - name: azure-keyvault-secrets-ts
          type: skill
          source: remote
          repo: microsoft/skills/.github/plugins/azure-sdk-typescript/skills
        - name: azure-keyvault-keys-ts
          type: skill
          source: remote
          repo: microsoft/skills/.github/plugins/azure-sdk-typescript/skills
        - name: azure-cosmos-ts
          type: skill
          source: remote
          repo: microsoft/skills/.github/plugins/azure-sdk-typescript/skills
        - name: azure-servicebus-ts
          type: skill
          source: remote
          repo: microsoft/skills/.github/plugins/azure-sdk-typescript/skills
        - name: azure-eventhub-ts
          type: skill
          source: remote
          repo: microsoft/skills/.github/plugins/azure-sdk-typescript/skills
        - name: azure-appconfiguration-ts
          type: skill
          source: remote
          repo: microsoft/skills/.github/plugins/azure-sdk-typescript/skills
        - name: azure-storage-queue-ts
          type: skill
          source: remote
          repo: microsoft/skills/.github/plugins/azure-sdk-typescript/skills
    reviewer:
      models:
        - "claude-sonnet-4.5"
        - "gemini-3-pro-preview"
      tools:
        - name: reviewer-skills
          type: skill
          source: local
          skill_dir: true
          path: "./skills/reviewer"
