# Pairwise testing config — multiple generator models, Azure MCP + local skills.
# Designed for use with `--pairwise` to ablate each tool across a panel of models.
configs:
  - name: pairwise/python-demo
    description: "Pairwise demo — multi-model generator panel with Azure MCP + local skills"
    generator:
      models:
        - "claude-opus-4.6"
        - "claude-sonnet-4.5"
        - "gpt-5.3-codex"
      tools:
        - name: azure
          type: mcp
          command: npx
          args: ["-y", "@azure/mcp@latest", "server", "start"]
          mcp_tools: ["*"]
        - name: generator-skills
          type: skill
          source: local
          skill_dir: true
          path: "./skills/generator"
    reviewer:
      models:
        - "claude-opus-4.6"
        - "gpt-4.1"
      tools:
        - name: reviewer-skills
          type: skill
          source: local
          skill_dir: true
          path: "./skills/reviewer"
    limits:
      max_turns: 75
