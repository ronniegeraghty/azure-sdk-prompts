# Three-arm comparison: baseline, Azure skills, and Azure skills plus SDK skills.
# Do not run with --pairwise; select all three config names explicitly.
configs:
  - name: python-azure-skills/baseline
    description: "Python baseline without Azure MCP or skills"
    generator:
      model: "gpt-5.6-sol"
      system_prompt: >
        When the prompt requests code, create a complete runnable project in the
        workspace using file-write tools. Include all required source files and
        dependency or project manifests. Place the primary project and its
        manifest at the workspace root so standard build commands run there.
        Do not provide the implementation only as Markdown code blocks in the
        final response. The final response may summarize the created files and
        include any requested explanation.
    reviewer:
      models:
        - "gpt-5.6-sol"
      tools:
        - name: reviewer-skills
          type: skill
          source: local
          skill_dir: true
          path: "./skills/reviewer"
    limits:
      max_turns: 100

  - name: python-azure-skills/azure-skill-mcp
    description: "Python with Azure MCP and general Azure skills"
    generator:
      model: "gpt-5.6-sol"
      system_prompt: >
        When the prompt requests code, create a complete runnable project in the
        workspace using file-write tools. Include all required source files and
        dependency or project manifests. Place the primary project and its
        manifest at the workspace root so standard build commands run there.
        Do not provide the implementation only as Markdown code blocks in the
        final response. The final response may summarize the created files and
        include any requested explanation.
      tools:
        - name: azure
          type: mcp
          command: npx
          args: ["-y", "@azure/mcp@3.0.0-beta.38", "server", "start"]
          mcp_tools: ["*"]
        - name: azure-skills
          type: plugin
          source: remote
          repo: microsoft/azure-skills
    reviewer:
      models:
        - "gpt-5.6-sol"
      tools:
        - name: reviewer-skills
          type: skill
          source: local
          skill_dir: true
          path: "./skills/reviewer"
    limits:
      max_turns: 100

  - name: python-azure-skills/azure-skill-mcp-microsoft-skill
    description: "Python with Azure MCP, general Azure skills, and Python SDK skills"
    generator:
      model: "gpt-5.6-sol"
      system_prompt: >
        When the prompt requests code, create a complete runnable project in the
        workspace using file-write tools. Include all required source files and
        dependency or project manifests. Place the primary project and its
        manifest at the workspace root so standard build commands run there.
        Do not provide the implementation only as Markdown code blocks in the
        final response. The final response may summarize the created files and
        include any requested explanation.
      tools:
        - name: azure
          type: mcp
          command: npx
          args: ["-y", "@azure/mcp@3.0.0-beta.38", "server", "start"]
          mcp_tools: ["*"]
        - name: azure-skills
          type: plugin
          source: remote
          repo: microsoft/azure-skills
        - name: azure-sdk-python
          type: plugin
          source: remote
          repo: microsoft/skills
    reviewer:
      models:
        - "gpt-5.6-sol"
      tools:
        - name: reviewer-skills
          type: skill
          source: local
          skill_dir: true
          path: "./skills/reviewer"
    limits:
      max_turns: 100
