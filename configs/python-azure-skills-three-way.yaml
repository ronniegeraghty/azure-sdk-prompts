# Three-arm comparison: baseline, Azure skills, and Azure skills plus SDK skills.
# Do not run with --pairwise; select all three config names explicitly.
configs:
  - name: python-azure-skills/baseline
    description: "Python baseline without Azure MCP or skills"
    generator:
      model: "gpt-5.6-sol"
    reviewer:
      models:
        - "gpt-5.6-sol"
      tools:
        - name: reviewer-skills
          type: skill
          source: local
          skill_dir: true
          path: "./skills/reviewer"
    limits:
      max_turns: 100

  - name: python-azure-skills/azure
    description: "Python with Azure MCP and general Azure skills"
    generator:
      model: "gpt-5.6-sol"
      tools:
        - name: azure
          type: mcp
          command: npx
          args: ["-y", "@azure/mcp@latest", "server", "start"]
          mcp_tools: ["*"]
        - name: azure-skills
          type: plugin
          source: remote
          repo: microsoft/azure-skills
    reviewer:
      models:
        - "gpt-5.6-sol"
      tools:
        - name: reviewer-skills
          type: skill
          source: local
          skill_dir: true
          path: "./skills/reviewer"
    limits:
      max_turns: 100

  - name: python-azure-skills/azure-with-sdk
    description: "Python with Azure MCP, general Azure skills, and Python SDK skills"
    generator:
      model: "gpt-5.6-sol"
      tools:
        - name: azure
          type: mcp
          command: npx
          args: ["-y", "@azure/mcp@latest", "server", "start"]
          mcp_tools: ["*"]
        - name: azure-skills
          type: plugin
          source: remote
          repo: microsoft/azure-skills
        - name: azure-sdk-python
          type: plugin
          source: remote
          repo: microsoft/skills
    reviewer:
      models:
        - "gpt-5.6-sol"
      tools:
        - name: reviewer-skills
          type: skill
          source: local
          skill_dir: true
          path: "./skills/reviewer"
    limits:
      max_turns: 100
