# Azure MCP with Claude Sonnet 4.5 — Azure MCP server attached
configs:
  - name: azure-mcp/claude-sonnet-4.5
    description: "Azure MCP — Claude Sonnet 4.5"
    generator:
      model: "claude-sonnet-4.5"
      tools:
        - name: azure
          type: mcp
          command: npx
          args: ["-y", "@azure/mcp@latest", "server", "start"]
          mcp_tools: ["*"]
    reviewer:
      models:
        - "claude-opus-4.6"
        - "gpt-4.1"
      tools:
        - name: reviewer-skills
          type: skill
          source: local
          skill_dir: true
          path: "./skills/reviewer"
