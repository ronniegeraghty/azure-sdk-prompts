# Test fixture config — fast iteration for grader development
configs:
  - name: test/baseline
    description: "Test fixture with Haiku and Sonnet generators (fast iteration)"
    generator:
      models:
        - "claude-haiku-4.5"
        - "claude-sonnet-4.6"
      # Each skill is registered as its own tool entry so `--pairwise` produces
      # one variant per skill (baseline, without-markdown-headings,
      # without-markdown-lists). Using individual paths instead of skill_dir.
      tools:
        - name: markdown-headings
          type: skill
          source: local
          path: "./skills/test/markdown-headings"
        - name: markdown-lists
          type: skill
          source: local
          path: "./skills/test/markdown-lists"
    reviewer:
      models:
        - "claude-haiku-4.5"
        - "gpt-4.1"
