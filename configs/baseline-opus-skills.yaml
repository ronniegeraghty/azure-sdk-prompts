# Baseline with Claude Opus 4.6 + remote Azure SDK TypeScript skills
# Skills are fetched from microsoft/skills via git sparse-checkout at eval time.
# See examples/configs/example-remote-skill.yaml for the remote-skill pattern.
configs:
  - name: baseline-skills/claude-opus-4.6
    description: "Baseline + Skills — Claude Opus 4.6 with remote Azure SDK skills"
    generator:
      model: "claude-opus-4.6"
      tools:
        - name: generator-skills
          type: skill
          source: local
          skill_dir: true
          path: "./skills/generator"
        - name: azure-identity-ts
          type: skill
          source: remote
          repo: microsoft/skills/.github/plugins/azure-sdk-typescript/skills
        - name: azure-storage-blob-ts
          type: skill
          source: remote
          repo: microsoft/skills/.github/plugins/azure-sdk-typescript/skills
        - name: azure-keyvault-secrets-ts
          type: skill
          source: remote
          repo: microsoft/skills/.github/plugins/azure-sdk-typescript/skills
        - name: azure-keyvault-keys-ts
          type: skill
          source: remote
          repo: microsoft/skills/.github/plugins/azure-sdk-typescript/skills
        - name: azure-cosmos-ts
          type: skill
          source: remote
          repo: microsoft/skills/.github/plugins/azure-sdk-typescript/skills
        - name: azure-servicebus-ts
          type: skill
          source: remote
          repo: microsoft/skills/.github/plugins/azure-sdk-typescript/skills
        - name: azure-eventhub-ts
          type: skill
          source: remote
          repo: microsoft/skills/.github/plugins/azure-sdk-typescript/skills
        - name: azure-appconfiguration-ts
          type: skill
          source: remote
          repo: microsoft/skills/.github/plugins/azure-sdk-typescript/skills
        - name: azure-storage-queue-ts
          type: skill
          source: remote
          repo: microsoft/skills/.github/plugins/azure-sdk-typescript/skills
    reviewer:
      models:
        - "claude-sonnet-4.5"
        - "gemini-3-pro-preview"
      tools:
        - name: reviewer-skills
          type: skill
          source: local
          skill_dir: true
          path: "./skills/reviewer"
    limits:
      max_turns: 150
