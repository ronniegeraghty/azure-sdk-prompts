when:
  language: python
graders:
  - name: DefaultAzureCredential Authentication
    type: prompt
    weight: 1.0
    prompt: >
      Check the following criteria:
      1. Uses DefaultAzureCredential (or another azure-identity credential) for authentication. No hardcoded connection strings, account keys, SAS tokens, or secrets embedded in source.
      2. Uses async/await patterns appropriately for Azure SDK operations.
  - name: Output Files Exist
    type: output_check
    weight: 1.0
    details:
      min_files: 1
      min_bytes_per_file: 1
