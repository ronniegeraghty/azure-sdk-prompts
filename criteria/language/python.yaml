when:
  language: python
graders:
  - name: DefaultAzureCredential Authentication
    type: prompt
    weight: 1.0
    prompt: "Check the following criteria:"
    checks:
      - Uses DefaultAzureCredential (or another azure-identity credential) for authentication. No hardcoded connection strings, account keys, SAS tokens, or secrets embedded in source.
      - Uses async/await patterns appropriately for Azure SDK operations.
  - name: Output Files Exist
    type: workspace
    weight: 1.0
    checks:
      - kind: file
        name: "*.py"
        state: present
        min_bytes: 1
  - name: Tool Usage Verification
    type: tool
    weight: 1.0
    checks:
      - kind: tool_used
        tool: azure
        source: mcp
        mcp_server: azure
