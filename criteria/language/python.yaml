when:
  language: python
graders:
  - name: Correct Package Imports
    type: prompt
    weight: 1.0
    prompt: >
      Imports use the latest azure-sdk-for-python package structure
      (azure.*), not deprecated packages.
  - name: DefaultAzureCredential Usage
    type: prompt
    weight: 1.0
    prompt: >
      Authentication matches what the prompt asks for. If the prompt
      explicitly requires a connection string (or other key-based auth),
      using `from_connection_string()` / connection-string-based clients
      is correct and should pass. Otherwise, authentication must use
      DefaultAzureCredential from azure-identity (or another
      `azure.identity` credential), not connection strings or hardcoded
      keys. Hardcoded secrets/keys/connection strings in source code
      always fail — required values should come from environment
      variables or a secret store.
  - name: Context Manager for Clients
    type: prompt
    weight: 1.0
    prompt: >
      Azure SDK clients that support context managers are used with
      `with` statements or explicitly closed.
  - name: Async Client Usage
    type: prompt
    weight: 1.0
    prompt: >
      If async operations are requested, code uses the async client
      variant with proper await patterns.
  - name: Proper Exception Handling
    type: prompt
    weight: 1.0
    prompt: >
      Azure SDK exceptions (HttpResponseError and subclasses) are
      caught and handled appropriately.
  - name: Output Files Exist
    type: workspace
    weight: 1.0
    checks:
      - kind: file
        name: "*.py"
        state: present
        min_bytes: 1
  - name: Tool Usage Verification
    type: tool
    weight: 1.0
    checks:
      - kind: tool_used
        source: mcp
        mcp_server: azure
