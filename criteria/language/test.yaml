# Test-language criteria — exercises all canonical grader kinds.
# Paired with prompts/test/hello-markdown.prompt.md (writes a small hello.md
# using the markdown-headings + markdown-lists skills).
#
# Uses only canonical kinds: prompt, output_check, tool, program, action_sequence.
when:
  language: test
graders:
  # ---------------------------------------------------------------------------
  # 1. prompt — LLM-judged checks. Uses both `prompt` (preamble) and `checks`
  #    (each becomes one pass/fail point).
  # ---------------------------------------------------------------------------
  - name: Markdown Structure
    type: prompt
    weight: 1.0
    prompt: "Check the following criteria:"
    checks:
      - File hello.md exists and contains a level-1 heading (starts with single #).
      - File contains exactly three bullet list items.
      # Intentionally failing — demonstrates failed-check rendering.
      - File hello.md contains a fenced code block tagged with the language `rust`.

  # ---------------------------------------------------------------------------
  # 2. output_check — workspace-delta boolean checks. Exercises every knob
  #    (min_files, max_files, require_files, forbid_files, require_updated,
  #    min_bytes_per_file, max_bytes_per_file).
  # ---------------------------------------------------------------------------
  - name: Output Files
    type: output_check
    weight: 1.0
    details:
      min_files: 1
      max_files: 5
      require_files:
        - hello.md
      forbid_files:
        - .env
        - secrets.txt
      # Intentionally fails — the prompt creates hello.md, never updates an
      # existing file. Demonstrates the require_updated sub-check.
      require_updated:
        - README.md
      min_bytes_per_file: 10
      max_bytes_per_file: 10000

  # ---------------------------------------------------------------------------
  # 3. tool — unified tool checks. Consolidates behavior/tool_constraint/tool_usage.
  #    Each check: one pass/fail point.
  # ---------------------------------------------------------------------------
  - name: Tool Checks
    type: tool
    weight: 1.0
    details:
      checks:
        # Turn limit check (formerly behavior grader).
        - kind: turn_limit
          n: 3
        # Required tool (formerly behavior grader).
        - kind: specific_tool
          name: skill
        # Forbidden tool (formerly behavior grader).
        - kind: tool_not_used
          name: bash
        # Min calls constraint (formerly tool_constraint grader).
        - kind: min_calls
          name: skill
          n: 2
        # Max calls constraint (formerly tool_constraint grader).
        - kind: max_calls
          name: skill
          n: 20
        # Group check: any skill plugin used (formerly tool_usage grader).
        - kind: any_of_group
          group: skill_plugin

  # ---------------------------------------------------------------------------
  # 4. action_sequence — ordered prefix of expected action names.
  # ---------------------------------------------------------------------------
  - name: Markdown Action Sequence
    type: action_sequence
    weight: 0.3
    details:
      expected_actions:
        - skill
        - write

  # ---------------------------------------------------------------------------
  # 5. program — runs a command in the workspace; exit 0 = pass.
  # ---------------------------------------------------------------------------
  - name: Hello.md Exists (program)
    type: program
    weight: 0.3
    details:
      command: test
      args:
        - -f
        - hello.md
      timeout: 5
