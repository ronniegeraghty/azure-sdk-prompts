when:
  language: test
graders:
  - name: Markdown Structure
    type: prompt
    weight: 1.0
    prompt: "Check the following criteria:"
    checks:
      - File hello.md exists and contains a level-1 heading (starts with single #).
      - File contains exactly three bullet list items.
  - name: Output Files Exist
    type: output_check
    weight: 1.0
    details:
      min_files: 1
      max_files: 1
      require_files:
        - hello.md
      min_bytes_per_file: 10
  - name: Hello.md File Check
    type: file
    weight: 0.5
    details:
      path: hello.md
      pattern: "^# Hello"
      must_exist: true
  - name: Efficient Behavior
    type: behavior
    weight: 0.5
    details:
      max_turns: 3
