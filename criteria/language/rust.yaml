when:
  language: rust
graders:
  - name: Official Azure SDK Crate Selection
    weight: 1.0
    prompt: >
      Cargo.toml uses official azure_* crates (azure_core, azure_identity,
      azure_storage_blob, azure_key_vault_secrets, azure_cosmos, etc.)
      published by the Azure SDK team. Must NOT use unofficial legacy
      crates such as azure_storage_blobs (plural).
  - name: TokenCredential Authentication
    weight: 1.0
    prompt: >
      Authentication uses a TokenCredential from azure_identity
      (DeveloperToolsCredential for development, AzureCliCredential,
      EnvironmentCredential, ManagedIdentityCredential,
      ClientSecretCredential, or WorkloadIdentityCredential) passed
      as Arc<dyn TokenCredential> or credential.clone(). The Rust SDK
      does not have DefaultAzureCredential. Must NOT use connection
      strings, shared access signatures, or hardcoded keys.
  - name: Async-First with Tokio Runtime
    weight: 1.0
    prompt: >
      Code follows the Azure SDK async-first model. The main function
      uses #[tokio::main] or an equivalent async runtime. Service
      client methods are awaited properly. No synchronous wrappers
      are provided for service methods.
  - name: Idiomatic Error Handling
    weight: 1.0
    prompt: >
      Error handling uses Result<T, E> and the ? operator. Calls to
      .unwrap() and .expect() are avoided or used only where failure
      is impossible. Azure service errors are matched via
      azure_core::Error with ErrorKind (e.g.,
      ErrorKind::HttpResponse { status, error_code, .. } with
      StatusCode comparison). The main function returns
      Result<(), Box<dyn std::error::Error>> or azure_core::Result<()>.
  - name: Correct Client Construction
    weight: 1.0
    prompt: >
      Service clients are constructed using the ::new() constructor
      with an endpoint string, credential, and Option<ClientOptions>.
      Client option structs use ..Default::default() for forward
      compatibility. Clients are immutable and thread-safe. The
      #[allow(clippy::needless_update)] annotation is used when all
      fields are assigned explicitly.
  - name: Cargo.toml Dependency Versions
    weight: 1.0
    prompt: >
      Cargo.toml specifies concrete version requirements for azure_*
      crates (not wildcard *). Dependencies include azure_core and
      azure_identity at compatible versions. The tokio and futures
      crates are included when async operations are used. Crates are
      installed via cargo add.
  - name: Pager and Stream Usage
    weight: 1.0
    prompt: >
      List operations return and consume azure_core::Pager<T> using
      futures::TryStreamExt (try_next/try_collect). Pagination is
      handled correctly by iterating all items from all pages.
      Prefers iterating individual items over page-by-page iteration
      unless there is an explicit need for page-level access via
      into_pages().
  - name: Response Handling
    weight: 1.0
    prompt: >
      Service method responses use Response<T> correctly. Code calls
      into_model() to deserialize the response body into the expected
      model type (not manually parsing JSON). When raw HTTP details
      are needed, deconstruct() is used to access status, headers,
      and body separately.
  - name: Long-Running Operations
    weight: 1.0
    prompt: >
      Long-running operations use azure_core::Poller<T> correctly.
      Code either awaits the Poller directly (via IntoFuture) for
      the final result, or iterates status updates via
      futures::TryStreamExt. LRO methods are called with the
      begin_ prefix convention where applicable.
  - name: Struct Initialization with Default
    weight: 1.0
    prompt: >
      All struct initialization for SDK types (client options, method
      options, model types) uses ..Default::default() to protect
      against future field additions. Non-vector model fields use
      Option<T>. Request-only models are constructible by the caller
      (not marked #[non_exhaustive]).
  - name: Rust Naming and Style Conventions
    weight: 1.0
    prompt: >
      Code follows Rust naming conventions: snake_case for functions
      and variables, CamelCase for types and traits,
      SCREAMING_SNAKE_CASE for constants. Uses use statements for
      imports rather than fully-qualified inline paths. Code is
      organized into functions, not a single monolithic main().
  - name: Ownership and Borrowing
    weight: 1.0
    prompt: >
      Code uses references (&str, &T) for borrowed data and avoids
      unnecessary .clone() calls. Credentials are shared via Arc or
      clone(). No unnecessary Box or Rc where Arc is appropriate.
      Parameters that are only used for URL construction borrow
      rather than own the data.
  - name: No Hardcoded Secrets
    weight: 1.0
    prompt: >
      Code does not contain hardcoded secrets, API keys, connection
      strings, or credentials. Sensitive values like endpoints are
      read from environment variables or configuration. No PII is
      leaked through Debug implementations; SafeDebug from azure_core
      is preferred over derive(Debug) for types containing sensitive
      data.
