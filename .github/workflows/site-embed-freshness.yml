name: Site Bundle Freshness

# Enforces that site/dist/ (the go:embed'd bundle) is kept in sync with
# site/src/**. Rebuilds the site on the PR branch and fails if the committed
# dist/ differs from a fresh build.
#
# Vite hashes asset filenames deterministically by content, so rebuilding
# identical source produces byte-identical output. The git diff --exit-code
# gate reliably detects stale bundles.

on:
  pull_request:
    branches:
      - '**'
    paths:
      - 'site/**'
      - 'hyoka/internal/serve/embed.go'
      - '.github/workflows/site-embed-freshness.yml'
  push:
    branches:
      - main
      - ronniegeraghty/dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-bundle-freshness:
    name: Verify site/dist/ is fresh
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        run: cd site && npm ci

      - name: Rebuild site bundle
        run: cd site && npm run build

      - name: Check if site/dist/ is up to date
        run: |
          if ! git diff --exit-code site/dist/; then
            echo ""
            echo "ERROR: site/dist/ is stale."
            echo "  site/src/** has changes that were not reflected in the committed bundle."
            echo "  Run 'cd site && npm run build' and commit the result."
            echo ""
            git --no-pager diff --stat site/dist/
            exit 1
          fi
          echo "[verify] site/dist/ is up to date."
